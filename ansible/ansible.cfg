[defaults]
roles_path = ./roles/_shared:./roles/1-bootstrap
host_key_checking = True
forks = 5
interpreter_python = auto_silent
log_path = logs/ansible.log
remote_tmp = /tmp/.ansible-${USER}/tmp
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o ControlPath=~/.ssh/cm-%C