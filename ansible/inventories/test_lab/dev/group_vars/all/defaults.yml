_iac__defaults__hostname: "{{ inventory_hostname }}"
_iac__defaults__timezone: "UTC"
_iac__defaults__directory_mode: "0755"
_iac__defaults__file_mode: "0644"
_iac__defaults__home_directory_mode: "0750"
_iac__defaults__ssh_directory_mode: "0700"
_iac__defaults__ssh_file_mode: "0600"
_iac__defaults__ssh_port: 22
_iac__defaults__custom_ssh_port: 32957
_iac__defaults__ssh_user: root
_iac__defaults__ssh_service_name: "ssh"
_iac__defaults__ssh_port_dropin_file_path: "/etc/ssh/sshd_config.d/05-ansible-port.conf"
_iac__defaults__ssh_main_dropin_file_path: "/etc/ssh/sshd_config.d/10-ansible-hardening.conf"
_iac__defaults__repository_base_directory: "{{ playbook_dir }}/../../../"
_iac__defaults__ansible_base_directory: "{{ _iac__defaults__repository_base_directory }}/ansible"
_iac__defaults__home_directory: "{{ lookup('env', 'HOME') }}"
_iac__defaults__ssh_base_directory: "{{ _iac__defaults__home_directory }}/.ssh"
_iac__defaults__ansible_ssh_private_key_file_directory: "{{ _iac__defaults__ssh_base_directory }}/ansible_ssh_key_files/{{ inventory_hostname }}"
_iac__defaults__ansible_ssh_private_key_file: "{{ _iac__defaults__ansible_ssh_private_key_file_directory }}/{{ ansible_user }}_id_ed25519"
_iac__defaults__ansible_ssh_private_key_file_directory_mode: "{{ _iac__defaults__ssh_directory_mode }}"
_iac__defaults__ansible_ssh_private_key_file_mode: "{{ _iac__defaults__ssh_file_mode }}"
_iac__defaults__ansible_artifacts_directory: "{{ _iac__defaults__ansible_base_directory }}/.artifacts"
_iac__defaults__dns_port: 53
