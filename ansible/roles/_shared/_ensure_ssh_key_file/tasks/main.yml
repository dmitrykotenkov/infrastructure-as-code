---
# =============================================================================
# Role: _ensure_ssh_key_file
# =============================================================================
# Provision SSH private key file from variable content.
# =============================================================================

# =============================================================================
# Section 0/4: Preconditions
# =============================================================================

- name: Shared | Ensure SSH Key File (0/4) | Preconditions [1/1] | Determine if SSH key provisioning is required
  delegate_to: localhost
  become: false
  ansible.builtin.set_fact:
    __iac__shared__ensure_ssh_key_file__required: >-
      {{
        iac__shared__ensure_ssh_key_file__ansible_ssh_private_key is defined
        and iac__shared__ensure_ssh_key_file__ansible_ssh_private_key is not none
        and (iac__shared__ensure_ssh_key_file__ansible_ssh_private_key | string | length) > 0
      }}
  changed_when: false

# =============================================================================
# Section 1/4: Validation
# =============================================================================

- name: Shared | Ensure SSH Key File (1/4) | Validation [1/4] | SSH private key file directory is defined
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - >-
        iac__common__ansible_ssh_private_key_file_directory is defined 
        and 
        iac__common__ansible_ssh_private_key_file_directory is not none 
        and 
        (iac__common__ansible_ssh_private_key_file_directory | string | length) > 0
    fail_msg: "Host {{ inventory_hostname }} is missing or has invalid SSH private key file directory variable."
    quiet: true
  changed_when: false
  when: __iac__shared__ensure_ssh_key_file__required | bool

- name: Shared | Ensure SSH Key File (1/4) | Validation [2/4] | SSH private key file is defined
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - >-
        iac__common__ansible_ssh_private_key_file is defined 
        and 
        iac__common__ansible_ssh_private_key_file is not none 
        and 
        (iac__common__ansible_ssh_private_key_file | string | length) > 0
    fail_msg: "Host {{ inventory_hostname }} is missing or has invalid SSH private key file variable."
    quiet: true
  changed_when: false
  when: __iac__shared__ensure_ssh_key_file__required | bool

- name: Shared | Ensure SSH Key File (1/4) | Validation [3/4] | SSH base directory is defined
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - >-
        iac__common__ssh_base_directory is defined 
        and 
        iac__common__ssh_base_directory is not none 
        and 
        (iac__common__ssh_base_directory | string | length) > 0
    fail_msg: "SSH base directory variable is missing or invalid."
    quiet: true
  run_once: true
  changed_when: false
  when: __iac__shared__ensure_ssh_key_file__required | bool

- name: Shared | Ensure SSH Key File (1/4) | Validation [4/4] | SSH base directory exists
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ iac__common__ssh_base_directory }}"
  register: __iac__shared__ensure_ssh_key_file__artifacts_dir_stat
  failed_when: >-
    not __iac__shared__ensure_ssh_key_file__artifacts_dir_stat.stat.exists
    or not __iac__shared__ensure_ssh_key_file__artifacts_dir_stat.stat.isdir
  run_once: true
  when: __iac__shared__ensure_ssh_key_file__required | bool

# =============================================================================
# Section 2/4: Main Tasks
# =============================================================================

- name: Shared | Ensure SSH Key File (2/4) | Main Tasks [1/2] | Create SSH private key file directory if not exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ iac__common__ansible_ssh_private_key_file_directory }}"
    state: directory
    mode: "{{ iac__common__ansible_ssh_private_key_file_directory_mode }}"
  check_mode: false
  throttle: 1
  when: __iac__shared__ensure_ssh_key_file__required | bool

- name: Shared | Ensure SSH Key File (2/4) | Main Tasks [2/2] | Write SSH private key content to file if not exists or differs
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    content: "{{ iac__shared__ensure_ssh_key_file__ansible_ssh_private_key }}"
    dest: "{{ iac__common__ansible_ssh_private_key_file }}"
    mode: "{{ iac__common__ansible_ssh_private_key_file_mode }}"
  check_mode: false
  throttle: 1
  no_log: true
  when: __iac__shared__ensure_ssh_key_file__required | bool

# =============================================================================
# Section 3/4: Result Validation
# =============================================================================

- name: Shared | Ensure SSH Key File (3/4) | Result Validation [1/1] | Validate SSH private key file with ssh-keygen
  delegate_to: localhost
  become: false
  ansible.builtin.command: "ssh-keygen -y -f {{ iac__common__ansible_ssh_private_key_file }}"
  changed_when: false
  no_log: true
  when: __iac__shared__ensure_ssh_key_file__required | bool

# =============================================================================
# Section 4/4: Completion Status
# =============================================================================

- name: Shared | Ensure SSH Key File (4/4) | Completion Status [1/1] | SSH key provisioning status
  delegate_to: localhost
  become: false
  ansible.builtin.debug:
    msg:
      - "  SSH private key provisioning completed"
      - "  File: {{ iac__common__ansible_ssh_private_key_file }}"
      - "  Mode: {{ iac__common__ansible_ssh_private_key_file_mode }}"
      - "  Validated: Yes"
  when: __iac__shared__ensure_ssh_key_file__required | bool
