---
# =============================================================================
# Section 1/9: Conditional Variable Setup
# =============================================================================
- name: Shared | Ensure SSH key file (1/9) - Determine if SSH key provisioning is required
  delegate_to: localhost
  become: false
  ansible.builtin.set_fact:
    __shared__ensure_ssh_key_file__required: >-
      {{
        iac__ansible_ssh_private_key is defined
        and iac__ansible_ssh_private_key is not none
        and (iac__ansible_ssh_private_key | string | length) > 0
      }}
  changed_when: false

# =============================================================================
# Section 2/9: Validate SSH private key file directory is defined
# =============================================================================
- name: Shared | Ensure SSH key file (2/9) - Validate SSH private key file directory is defined
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - >-
        iac__common__ansible_ssh_private_key_file_directory is defined 
        and 
        iac__common__ansible_ssh_private_key_file_directory is not none 
        and 
        (iac__common__ansible_ssh_private_key_file_directory | string | length)
    fail_msg: "Host {{ inventory_hostname }} is missing or has invalid SSH private key file directory variable."
    quiet: true
  changed_when: false
  when: __shared__ensure_ssh_key_file__required | bool

# =============================================================================
# Section 3/9: Validate SSH private key file is defined
# =============================================================================
- name: Shared | Ensure SSH key file (3/9) - Validate SSH private key file is defined
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - >-
        iac__common__ansible_ssh_private_key_file is defined 
        and 
        iac__common__ansible_ssh_private_key_file is not none 
        and 
        (iac__common__ansible_ssh_private_key_file | string | length)
    fail_msg: "Host {{ inventory_hostname }} is missing or has invalid SSH private key file variable."
    quiet: true
  changed_when: false
  when: __shared__ensure_ssh_key_file__required | bool

# =============================================================================
# Section 4/9: Validate Ansible .artifacts directory is defined
# =============================================================================
- name: Shared | Ensure SSH key file (4/9) - Validate Ansible .artifacts directory is defined
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - >-
        iac__common__ansible_artifacts_directory is defined 
        and 
        iac__common__ansible_artifacts_directory is not none 
        and 
        (iac__common__ansible_artifacts_directory | string | length)
    fail_msg: "Ansible .artifacts directory variable is missing or invalid."
    quiet: true
  run_once: true
  changed_when: false
  when: __shared__ensure_ssh_key_file__required | bool

# =============================================================================
# Section 5/9: Validate Ansible .artifacts directory exists
# =============================================================================
- name: Shared | Ensure SSH key file (5/9) - Validate Ansible .artifacts directory exists
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ iac__common__ansible_artifacts_directory }}"
  register: __shared__ensure_ssh_key_file__artifacts_dir_stat
  failed_when: >-
    not __shared__ensure_ssh_key_file__artifacts_dir_stat.stat.exists
    or not __shared__ensure_ssh_key_file__artifacts_dir_stat.stat.isdir
  run_once: true
  when: __shared__ensure_ssh_key_file__required | bool

# =============================================================================
# Section 6/9: Create SSH private key file directory if not exists
# =============================================================================
- name: Shared | Ensure SSH key file (6/9) - Create SSH private key file directory if not exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ iac__common__ansible_ssh_private_key_file_directory }}"
    state: directory
    mode: "{{ iac__common__ansible_ssh_private_key_file_directory_mode }}"
  throttle: 1
  when: __shared__ensure_ssh_key_file__required | bool

# =============================================================================
# Section 7/9: Write SSH private key content to file if not exists or differs
# =============================================================================
- name: Shared | Ensure SSH key file (7/9) - Write SSH private key content to file if not exists or differs
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    content: "{{ iac__ansible_ssh_private_key }}"
    dest: "{{ iac__common__ansible_ssh_private_key_file }}"
    mode: "{{ iac__common__ansible_ssh_private_key_file_mode }}"
  throttle: 1
  no_log: true
  when: __shared__ensure_ssh_key_file__required | bool

# =============================================================================
# Section 8/9: Validate SSH private key file with ssh-keygen
# =============================================================================
- name: Shared | Ensure SSH key file (8/9) - Validate SSH private key file with ssh-keygen
  delegate_to: localhost
  become: false
  ansible.builtin.command: "ssh-keygen -y -f {{ iac__common__ansible_ssh_private_key_file }}"
  changed_when: false
  no_log: true
  when: __shared__ensure_ssh_key_file__required | bool

# =============================================================================
# Section 9/9: Display completion status
# =============================================================================
- name: Shared | Ensure SSH key file (9/9) - Display SSH key provisioning status
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.debug:
    msg:
      - "✓ SSH private key provisioning completed"
      - "  File: {{ iac__common__ansible_ssh_private_key_file }}"
      - "  Mode: {{ iac__common__ansible_ssh_private_key_file_mode }}"
      - "  Directory: {{ iac__common__ansible_ssh_private_key_file_directory }}"
      - "  Validated: Yes"
  when: __shared__ensure_ssh_key_file__required | bool
