---
# =============================================================================
# Section 1/8: Validate required variables
# =============================================================================
- name: Shared | Sync known_hosts (1/8)[1/2] - Validate ansible_port is defined and valid
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - ansible_port is defined
      - (ansible_port | int) > 0
      - (ansible_port | int) < 65536
    fail_msg: "Host {{ inventory_hostname }} is missing ansible_port variable or it is invalid."
    quiet: true
  changed_when: false

- name: Shared | Sync known_hosts (1/8)[2/2] - Validate ansible_host is defined
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - ansible_host is defined
      - ansible_host is not none
      - (ansible_host | string | length) > 0
    fail_msg: "Host {{ inventory_hostname }} is missing ansible_host variable or it is invalid."
    quiet: true
  changed_when: false

# =============================================================================
# Section 2/8: Set internal variables
# =============================================================================
- name: Shared | Sync known_hosts (2/8) - Set internal variables
  delegate_to: localhost
  become: false
  ansible.builtin.set_fact:
    __shared__sync_known_hosts__ssh_dir: "{{ lookup('env', 'HOME') }}/.ssh"
    __shared__sync_known_hosts__known_hosts_file: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
    __shared__sync_known_hosts__host_ip: "{{ ansible_host }}"
    __shared__sync_known_hosts__target_port: "{{ ansible_port | int }}"
  changed_when: false

# =============================================================================
# Section 3/8: Ensure SSH directory exists
# =============================================================================
- name: Shared | Sync known_hosts (3/8) - Ensure SSH directory exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ __shared__sync_known_hosts__ssh_dir }}"
    state: directory
    mode: "{{ iac__common__ssh_directory_mode }}"
  check_mode: false
  throttle: 1

# =============================================================================
# Section 4/8: Ensure known_hosts file exists
# =============================================================================
- name: Shared | Sync known_hosts (4/8) - Ensure known_hosts file exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ __shared__sync_known_hosts__known_hosts_file }}"
    state: touch
    mode: "{{ iac__common__ssh_file_mode }}"
  changed_when: false
  check_mode: false
  throttle: 1

# =============================================================================
# Section 5/8: Remove stale host key entries
# =============================================================================
- name: Shared | Sync known_hosts (5/8)[1/2] - Remove stale key (plain hostname format)
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ __shared__sync_known_hosts__host_ip }}"
      - -f
      - "{{ __shared__sync_known_hosts__known_hosts_file }}"
  changed_when: false
  failed_when: false
  check_mode: false
  throttle: 1

- name: Shared | Sync known_hosts (5/8)[2/2] - Remove stale key ([host]:port format)
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "[{{ __shared__sync_known_hosts__host_ip }}]:{{ __shared__sync_known_hosts__target_port }}"
      - -f
      - "{{ __shared__sync_known_hosts__known_hosts_file }}"
  changed_when: false
  failed_when: false
  check_mode: false
  throttle: 1
  when: __shared__sync_known_hosts__target_port | int != 22

# =============================================================================
# Section 6/8: Scan host key from target
# =============================================================================
- name: Shared | Sync known_hosts (6/8) - Scan host key on target port
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - ssh-keyscan
      - -T
      - "{{ iac__shared__sync_known_hosts__ssh_keyscan_timeout | string }}"
      - -p
      - "{{ __shared__sync_known_hosts__target_port | string }}"
      - -t
      - "{{ iac__shared__sync_known_hosts__ssh_keyscan_types }}"
      - "{{ __shared__sync_known_hosts__host_ip }}"
  register: __shared__sync_known_hosts__scan_result
  changed_when: false
  check_mode: false
  retries: "{{ iac__shared__sync_known_hosts__ssh_keyscan_retries }}"
  delay: "{{ iac__shared__sync_known_hosts__ssh_keyscan_delay }}"
  until: __shared__sync_known_hosts__scan_result.stdout | trim != ""

# =============================================================================
# Section 7/8: Add scanned key to known_hosts
# =============================================================================
- name: Shared | Sync known_hosts (7/8)[1/2] - Add key to known_hosts (plain format for port 22)
  delegate_to: localhost
  become: false
  ansible.builtin.known_hosts:
    path: "{{ __shared__sync_known_hosts__known_hosts_file }}"
    name: "{{ __shared__sync_known_hosts__host_ip }}"
    key: "{{ item }}"
    hash_host: "{{ iac__shared__sync_known_hosts__hash_hosts }}"
    state: present
  loop: "{{ __shared__sync_known_hosts__scan_result.stdout_lines }}"
  check_mode: false
  throttle: 1
  no_log: true
  when: __shared__sync_known_hosts__target_port | int == 22

- name: Shared | Sync known_hosts (7/8)[2/2] - Add key to known_hosts ([host]:port format)
  delegate_to: localhost
  become: false
  ansible.builtin.known_hosts:
    path: "{{ __shared__sync_known_hosts__known_hosts_file }}"
    name: "[{{ __shared__sync_known_hosts__host_ip }}]:{{ __shared__sync_known_hosts__target_port }}"
    key: >-
      {{ item | regex_replace(
           '^' ~ __shared__sync_known_hosts__host_ip ~ '\\s+',
           '[' ~ __shared__sync_known_hosts__host_ip ~ ']:' ~ (__shared__sync_known_hosts__target_port | string) ~ ' '
         )
      }}
    hash_host: "{{ iac__shared__sync_known_hosts__hash_hosts }}"
    state: present
  loop: "{{ __shared__sync_known_hosts__scan_result.stdout_lines }}"
  check_mode: false
  throttle: 1
  no_log: true
  when: __shared__sync_known_hosts__target_port | int != 22

# =============================================================================
# Section 8/8: Display completion status
# =============================================================================
- name: Shared | Sync known_hosts (8/8) - Display sync status
  delegate_to: localhost
  become: false
  ansible.builtin.debug:
    msg:
      - "  known_hosts synced successfully"
      - "  Host: {{ __shared__sync_known_hosts__host_ip }}"
      - "  Port: {{ __shared__sync_known_hosts__target_port }}"
      - "  File: {{ __shared__sync_known_hosts__known_hosts_file }}"
