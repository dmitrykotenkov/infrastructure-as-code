---
# =============================================================================
# Role: _sync_known_hosts
# =============================================================================
# Synchronize SSH known hosts.
# =============================================================================

# =============================================================================
# Section 1/4: Validation
# =============================================================================

- name: Shared | Sync Known Hosts (1/4) | Validation [1/2] | Ansible port is defined and valid
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - ansible_port is defined
      - (ansible_port | int) > 0
      - (ansible_port | int) < 65536
    fail_msg: "Host {{ inventory_hostname }} is missing ansible_port variable or it is invalid."
    quiet: true
  changed_when: false

- name: Shared | Sync Known Hosts (1/4) | Validation [2/2] | Ansible host is defined
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - ansible_host is defined
      - ansible_host is not none
      - (ansible_host | string | length) > 0
    fail_msg: "Host {{ inventory_hostname }} is missing ansible_host variable or it is invalid."
    quiet: true
  changed_when: false

# =============================================================================
# Section 2/4: Main Tasks
# =============================================================================

- name: Shared | Sync Known Hosts (2/4) | Main Tasks [1/8] | Set internal variables
  delegate_to: localhost
  become: false
  ansible.builtin.set_fact:
    __iac__shared__sync_known_hosts__ssh_dir: "{{ iac__common__ssh_base_directory }}"
    __iac__shared__sync_known_hosts__known_hosts_file: "{{ iac__common__ssh_base_directory }}/known_hosts"
    __iac__shared__sync_known_hosts__host_ip: "{{ ansible_host }}"
    __iac__shared__sync_known_hosts__target_port: "{{ ansible_port | int }}"
  changed_when: false

- name: Shared | Sync Known Hosts (2/4) | Main Tasks [2/8] | Create SSH directory if not exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ __iac__shared__sync_known_hosts__ssh_dir }}"
    state: directory
    mode: "{{ iac__common__ssh_directory_mode }}"
  check_mode: false
  throttle: 1

- name: Shared | Sync Known Hosts (2/4) | Main Tasks [3/8] | Create known_hosts file if not exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ __iac__shared__sync_known_hosts__known_hosts_file }}"
    state: touch
    mode: "{{ iac__common__ssh_file_mode }}"
  changed_when: false
  check_mode: false
  throttle: 1

- name: Shared | Sync Known Hosts (2/4) | Main Tasks [4/8] | Remove stale host key entry for plain hostname
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ __iac__shared__sync_known_hosts__host_ip }}"
      - -f
      - "{{ __iac__shared__sync_known_hosts__known_hosts_file }}"
  changed_when: false
  failed_when: false
  check_mode: false
  throttle: 1

- name: Shared | Sync Known Hosts (2/4) | Main Tasks [5/8] | Remove stale host key entry for [host]:port format
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "[{{ __iac__shared__sync_known_hosts__host_ip }}]:{{ __iac__shared__sync_known_hosts__target_port }}"
      - -f
      - "{{ __iac__shared__sync_known_hosts__known_hosts_file }}"
  changed_when: false
  failed_when: false
  when: __iac__shared__sync_known_hosts__target_port | int != 22
  check_mode: false
  throttle: 1

- name: Shared | Sync Known Hosts (2/4) | Main Tasks [6/8] | Scan host key from target
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - ssh-keyscan
      - -T
      - "{{ iac__shared__sync_known_hosts__ssh_keyscan_timeout | string }}"
      - -p
      - "{{ __iac__shared__sync_known_hosts__target_port | string }}"
      - -t
      - "{{ iac__shared__sync_known_hosts__ssh_keyscan_types }}"
      - "{{ __iac__shared__sync_known_hosts__host_ip }}"
  register: __iac__shared__sync_known_hosts__scan_result
  changed_when: false
  retries: "{{ iac__shared__sync_known_hosts__ssh_keyscan_retries }}"
  delay: "{{ iac__shared__sync_known_hosts__ssh_keyscan_delay }}"
  until: __iac__shared__sync_known_hosts__scan_result.stdout | trim != ""
  check_mode: false

- name: Shared | Sync Known Hosts (2/4) | Main Tasks [7/8] | Add scanned key to known_hosts for port 22
  delegate_to: localhost
  become: false
  ansible.builtin.known_hosts:
    path: "{{ __iac__shared__sync_known_hosts__known_hosts_file }}"
    name: "{{ __iac__shared__sync_known_hosts__host_ip }}"
    key: "{{ item }}"
    hash_host: "{{ iac__shared__sync_known_hosts__hash_hosts }}"
    state: present
  when: __iac__shared__sync_known_hosts__target_port | int == 22
  loop: "{{ __iac__shared__sync_known_hosts__scan_result.stdout_lines }}"
  check_mode: false
  throttle: 1
  no_log: true

- name: Shared | Sync Known Hosts (2/4) | Main Tasks [8/8] | Add scanned key to known_hosts for non-standard port
  delegate_to: localhost
  become: false
  ansible.builtin.known_hosts:
    path: "{{ __iac__shared__sync_known_hosts__known_hosts_file }}"
    name: "[{{ __iac__shared__sync_known_hosts__host_ip }}]:{{ __iac__shared__sync_known_hosts__target_port }}"
    key: >-
      {{ item | regex_replace(
           '^' ~ __iac__shared__sync_known_hosts__host_ip ~ '\\s+',
           '[' ~ __iac__shared__sync_known_hosts__host_ip ~ ']:' ~ (__iac__shared__sync_known_hosts__target_port | string) ~ ' '
         )
      }}
    hash_host: "{{ iac__shared__sync_known_hosts__hash_hosts }}"
    state: present
  when: __iac__shared__sync_known_hosts__target_port | int != 22
  loop: "{{ __iac__shared__sync_known_hosts__scan_result.stdout_lines }}"
  check_mode: false
  throttle: 1
  no_log: true

# =============================================================================
# Section 3/4: Result Validation
# =============================================================================
# No result validation needed for this role

# =============================================================================
# Section 4/4: Completion Status
# =============================================================================

- name: Shared | Sync Known Hosts (4/4) | Completion Status [1/1] | Known hosts sync status
  delegate_to: localhost
  become: false
  ansible.builtin.debug:
    msg:
      - "  Known hosts synchronization completed"
      - "  Host: {{ __iac__shared__sync_known_hosts__host_ip }}"
      - "  Port: {{ __iac__shared__sync_known_hosts__target_port }}"
      - "  File: {{ __iac__shared__sync_known_hosts__known_hosts_file }}"
