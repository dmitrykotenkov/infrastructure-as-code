---
# =============================================================================
# Section 1/2: Validation
# =============================================================================
- name: Shared | Validate Auth Method (1/2) | Validation [1/2] | Exactly one authentication method is defined
  ansible.builtin.assert:
    that:
      - >
        (ansible_password is defined and ansible_ssh_private_key_file is not defined)
        or
        (ansible_password is not defined and ansible_ssh_private_key_file is defined)
    fail_msg: >-
      Host {{ inventory_hostname }} must define exactly one authentication method:
      either ansible_password or ansible_ssh_private_key_file (from inventory/vault).
    quiet: true
  changed_when: false

- name: Shared | Validate Auth Method (1/2) | Validation [2/2] | Required connection variables are defined
  ansible.builtin.assert:
    that:
      - ansible_host is defined and ansible_host is not none and (ansible_host | string | length) > 0
      - ansible_port is defined and (ansible_port | int) > 0 and (ansible_port | int) < 65536
      - ansible_user is defined and ansible_user is not none and (ansible_user | string | length) > 0
    fail_msg: >-
      Host {{ inventory_hostname }} is missing required connection variables
      (ansible_host / ansible_port / ansible_user) or they are invalid.
    quiet: true
  changed_when: false

# =============================================================================
# Section 2/2: Completion Status
# =============================================================================
- name: Shared | Validate Auth Method (2/2) | Completion Status [1/1] | Authentication method validation status
  ansible.builtin.debug:
    msg: "  Authentication method validation completed for {{ inventory_hostname }}"
