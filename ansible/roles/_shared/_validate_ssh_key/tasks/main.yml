---
# =============================================================================
# Role: _validate_ssh_key
# =============================================================================
# Validate SSH key existence and format.
# =============================================================================

# =============================================================================
# Section 1/2: Validation
# =============================================================================

- name: Shared | Validate SSH Key (1/2) | Validation [1/1] | Only SSH key authentication is defined
  ansible.builtin.assert:
    that:
      - ansible_ssh_private_key_file is defined
      - ansible_password is not defined
    fail_msg: >-
      Key-only policy: ansible_ssh_private_key_file must be set and ansible_password must not be set.
    quiet: true
  changed_when: false

# =============================================================================
# Section 2/2: Completion Status
# =============================================================================

- name: Shared | Validate SSH Key (2/2) | Completion Status [1/1] | SSH key validation status
  ansible.builtin.debug:
    msg: "  SSH key validation completed for {{ inventory_hostname }}"
