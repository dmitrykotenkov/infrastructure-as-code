---
# =============================================================================
# Role: _update_current_user
# =============================================================================
# Updates the currently connected user with new password and/or SSH key.
# Reusable role - all configuration via variables at playbook level.
# =============================================================================

# =============================================================================
# Section 0/4: Preconditions
# =============================================================================

- name: Shared | Update Current User (0/4) | Preconditions [1/2] | Skip role if disabled
  ansible.builtin.meta: end_host
  when: iac__shared__update_current_user__skip | bool

- name: Shared | Update Current User (0/4) | Preconditions [2/2] | Gather user facts
  ansible.builtin.set_fact:
    __iac__shared__update_current_user__name: "{{ ansible_user_id }}"
    __iac__shared__update_current_user__home: "{{ ansible_env.HOME | default('/root' if ansible_user_id == 'root' else '/home/' ~ ansible_user_id) }}"

# =============================================================================
# Section 1/4: Validation
# =============================================================================

- name: Shared | Update Current User (1/4) | Validation [1/3] | Check password variable
  ansible.builtin.set_fact:
    __iac__shared__update_current_user__password_defined: >-
      {{ iac__shared__update_current_user__password is not none and
         (iac__shared__update_current_user__password | string | length) > 0 }}

- name: Shared | Update Current User (1/4) | Validation [2/3] | Check SSH key variable
  ansible.builtin.set_fact:
    __iac__shared__update_current_user__ssh_key_defined: >-
      {{ iac__shared__update_current_user__ssh_public_key is not none and
         (iac__shared__update_current_user__ssh_public_key | string | length) > 0 }}

- name: Shared | Update Current User (1/4) | Validation [3/3] | Assert at least one update defined
  ansible.builtin.assert:
    that:
      - __iac__shared__update_current_user__password_defined | bool or __iac__shared__update_current_user__ssh_key_defined | bool
    fail_msg: |
      At least one update must be specified:
      - iac__shared__update_current_user__password: New password
      - iac__shared__update_current_user__ssh_public_key: New SSH public key
      Current user: {{ __iac__shared__update_current_user__name }}
    quiet: true

# =============================================================================
# Section 2/4: Main Tasks
# =============================================================================

# -----------------------------------------------------------------------------
# Password Configuration
# -----------------------------------------------------------------------------

- name: Shared | Update Current User (2/4) | Main Tasks [1/7] | Compute password hash salt
  ansible.builtin.set_fact:
    __iac__shared__update_current_user__salt: >-
      {{ (inventory_hostname ~ '_' ~ __iac__shared__update_current_user__name) | hash('sha1') | truncate(16, True, '') }}
  when: __iac__shared__update_current_user__password_defined | bool
  no_log: true

- name: Shared | Update Current User (2/4) | Main Tasks [2/7] | Set user password
  ansible.builtin.user:
    name: "{{ __iac__shared__update_current_user__name }}"
    password: "{{ iac__shared__update_current_user__password | password_hash('sha512', __iac__shared__update_current_user__salt) }}"
    update_password: "{{ iac__shared__update_current_user__force_password_update | ternary('always', 'on_create') }}"
  when: __iac__shared__update_current_user__password_defined | bool
  no_log: true

- name: Shared | Update Current User (2/4) | Main Tasks [3/7] | Lock password if requested
  ansible.builtin.user:
    name: "{{ __iac__shared__update_current_user__name }}"
    password_lock: true
  when:
    - __iac__shared__update_current_user__password_defined | bool
    - iac__shared__update_current_user__lock_password | bool

# -----------------------------------------------------------------------------
# SSH Key Configuration
# -----------------------------------------------------------------------------

- name: Shared | Update Current User (2/4) | Main Tasks [4/7] | Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ __iac__shared__update_current_user__home }}/.ssh"
    state: directory
    owner: "{{ __iac__shared__update_current_user__name }}"
    group: "{{ __iac__shared__update_current_user__name }}"
    mode: "{{ iac__shared__update_current_user__ssh_directory_mode }}"
  when: __iac__shared__update_current_user__ssh_key_defined | bool

- name: Shared | Update Current User (2/4) | Main Tasks [5/7] | Install SSH public key
  ansible.posix.authorized_key:
    user: "{{ __iac__shared__update_current_user__name }}"
    key: "{{ iac__shared__update_current_user__ssh_public_key }}"
    state: present
    manage_dir: false
    exclusive: "{{ iac__shared__update_current_user__ssh_key_mode == 'replace' }}"
  when: __iac__shared__update_current_user__ssh_key_defined | bool

- name: Shared | Update Current User (2/4) | Main Tasks [6/7] | Set authorized_keys permissions
  ansible.builtin.file:
    path: "{{ __iac__shared__update_current_user__home }}/.ssh/authorized_keys"
    owner: "{{ __iac__shared__update_current_user__name }}"
    group: "{{ __iac__shared__update_current_user__name }}"
    mode: "{{ iac__shared__update_current_user__authorized_keys_mode }}"
  when: __iac__shared__update_current_user__ssh_key_defined | bool

# -----------------------------------------------------------------------------
# Optional Configuration
# -----------------------------------------------------------------------------

- name: Shared | Update Current User (2/4) | Main Tasks [7/7] | Update shell if specified
  ansible.builtin.user:
    name: "{{ __iac__shared__update_current_user__name }}"
    shell: "{{ iac__shared__update_current_user__shell }}"
  when:
    - iac__shared__update_current_user__shell is not none
    - (iac__shared__update_current_user__shell | string | length) > 0

# =============================================================================
# Section 3/4: Result Validation
# =============================================================================

- name: Shared | Update Current User (3/4) | Result Validation [1/2] | Verify password is set
  ansible.builtin.shell: |
    set -o pipefail
    grep '^{{ __iac__shared__update_current_user__name }}:' /etc/shadow | cut -d: -f2 | grep -v '^[!*]'
  args:
    executable: /bin/bash
  when:
    - __iac__shared__update_current_user__password_defined | bool
    - not (iac__shared__update_current_user__lock_password | bool)
  register: __iac__shared__update_current_user__password_check
  changed_when: false
  failed_when: __iac__shared__update_current_user__password_check.rc != 0

- name: Shared | Update Current User (3/4) | Result Validation [2/2] | Verify SSH key installed
  ansible.builtin.stat:
    path: "{{ __iac__shared__update_current_user__home }}/.ssh/authorized_keys"
  register: __iac__shared__update_current_user__authkeys
  when: __iac__shared__update_current_user__ssh_key_defined | bool

# =============================================================================
# Section 4/4: Completion Status
# =============================================================================

- name: Shared | Update Current User (4/4) | Completion Status [1/1] | Display update summary
  ansible.builtin.debug:
    msg:
      - "  Current user updated successfully"
      - "  Username: {{ __iac__shared__update_current_user__name }}"
      - "  Home: {{ __iac__shared__update_current_user__home }}"
      - "  Password updated: {{ __iac__shared__update_current_user__password_defined | bool | ternary('yes', 'no') }}"
      - "  Password locked: {{ (iac__shared__update_current_user__lock_password | bool) | ternary('yes', 'no') }}"
      - "  SSH key installed: {{ __iac__shared__update_current_user__ssh_key_defined | bool | ternary('yes', 'no') }}"
