---
# =============================================================================
# Optional variables (can be overridden at playbook or inventory level)
# =============================================================================
iac__bootstrap__process_accounting__skip: false

iac__bootstrap__process_accounting__remove: false

# Enable process accounting (records all executed commands)
iac__bootstrap__process_accounting__enabled: true
iac__bootstrap__process_accounting__log_file: "/var/log/account/pacct"

iac__bootstrap__process_accounting__log_rotate_file_count: 30
# Log rotation frequency (daily, weekly, monthly)
iac__bootstrap__process_accounting__log_rotate_frequency: "daily"
iac__bootstrap__process_accounting__rotated_log_file_compress: true

iac__bootstrap__process_accounting__generate_daily_reports: true
iac__bootstrap__process_accounting__daily_reports_directory: "/var/log/account/reports"
iac__bootstrap__process_accounting__daily_report_retention_days: 30
