---
# =============================================================================
# Role: 04_core_dumps
# =============================================================================
# Disables core dumps to prevent sensitive data leakage from process crashes.
# Applies restrictions via limits.conf and sysctl.
# =============================================================================

# =============================================================================
# Section 1/4: Validation
# =============================================================================

- name: Bootstrap | Core Dumps (1/4) | Validation | Validate inputs
  when: not (iac__bootstrap__core_dumps__skip | bool)
  block:
    - name: Bootstrap | Core Dumps (1/4) | Validation [1/2] | Assert limits file path defined
      ansible.builtin.assert:
        that:
          - iac__bootstrap__core_dumps__limits_file is defined
          - (iac__bootstrap__core_dumps__limits_file | string | length) > 0
        fail_msg: "iac__bootstrap__core_dumps__limits_file must be defined and non-empty"
        quiet: true

    - name: Bootstrap | Core Dumps (1/4) | Validation [2/2] | Assert sysctl file path defined
      ansible.builtin.assert:
        that:
          - iac__bootstrap__core_dumps__sysctl_file is defined
          - (iac__bootstrap__core_dumps__sysctl_file | string | length) > 0
        fail_msg: "iac__bootstrap__core_dumps__sysctl_file must be defined and non-empty"
        quiet: true

# =============================================================================
# Section 2/4: Main Tasks
# =============================================================================

- name: Bootstrap | Core Dumps (2/4) | Main Tasks | Configure core dumps
  when: not (iac__bootstrap__core_dumps__skip | bool)
  block:
    # -------------------------------------------------------------------------
    # Disable Core Dumps
    # -------------------------------------------------------------------------

    - name: Bootstrap | Core Dumps (2/4) | Main Tasks [1/3] | Disable core dumps via limits.conf
      ansible.builtin.copy:
        dest: "{{ iac__bootstrap__core_dumps__limits_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible - Core Dump Restrictions
          # Disable core dumps for security (prevents sensitive data leakage)
          #
          # Format: <domain> <type> <item> <value>
          # - domain: username, @groupname, or * for all
          # - type: hard (enforced maximum) or soft (default, can be raised to hard)
          # - item: core (core dump size limit)
          # - value: 0 (disable completely)
          
          *     hard   core    0
          *     soft   core    0
          root  hard   core    0
          root  soft   core    0
      when: iac__bootstrap__core_dumps__disable | bool

    - name: Bootstrap | Core Dumps (2/4) | Main Tasks [2/3] | Disable setuid core dumps via sysctl
      ansible.posix.sysctl:
        name: fs.suid_dumpable
        value: "0"
        state: present
        sysctl_file: "{{ iac__bootstrap__core_dumps__sysctl_file }}"
        reload: true
      when: iac__bootstrap__core_dumps__disable | bool

    - name: Bootstrap | Core Dumps (2/4) | Main Tasks [3/3] | Disable core pattern (systemd-coredump)
      ansible.posix.sysctl:
        name: kernel.core_pattern
        value: "|/bin/false"
        state: present
        sysctl_file: "{{ iac__bootstrap__core_dumps__sysctl_file }}"
        reload: true
      when: iac__bootstrap__core_dumps__disable | bool

    # -----------------------------------------------------------------------------
    # Enable Core Dumps (if explicitly requested)
    # -----------------------------------------------------------------------------

    - name: Bootstrap | Core Dumps (2/4) | Main Tasks [4/3] | Remove limits restriction file
      ansible.builtin.file:
        path: "{{ iac__bootstrap__core_dumps__limits_file }}"
        state: absent
      when: not (iac__bootstrap__core_dumps__disable | bool)

    - name: Bootstrap | Core Dumps (2/4) | Main Tasks [5/3] | Remove sysctl restriction file
      ansible.builtin.file:
        path: "{{ iac__bootstrap__core_dumps__sysctl_file }}"
        state: absent
      when: not (iac__bootstrap__core_dumps__disable | bool)

# =============================================================================
# Section 3/4: Result Validation
# =============================================================================

- name: Bootstrap | Core Dumps (3/4) | Result Validation | Verify configuration
  when: not (iac__bootstrap__core_dumps__skip | bool)
  block:
    - name: Bootstrap | Core Dumps (3/4) | Result Validation [1/2] | Verify suid_dumpable is disabled
      ansible.builtin.command: sysctl -n fs.suid_dumpable
      when: iac__bootstrap__core_dumps__disable | bool
      register: __iac__bootstrap__core_dumps__suid_check
      changed_when: false
      failed_when: __iac__bootstrap__core_dumps__suid_check.stdout != "0"

    - name: Bootstrap | Core Dumps (3/4) | Result Validation [2/2] | Verify limits file exists
      ansible.builtin.stat:
        path: "{{ iac__bootstrap__core_dumps__limits_file }}"
      when: iac__bootstrap__core_dumps__disable | bool
      register: __iac__bootstrap__core_dumps__limits_stat
      failed_when: not __iac__bootstrap__core_dumps__limits_stat.stat.exists

# =============================================================================
# Section 4/4: Completion Status
# =============================================================================

- name: Bootstrap | Core Dumps (4/4) | Completion Status | Display summary
  when: not (iac__bootstrap__core_dumps__skip | bool)
  block:
    - name: Bootstrap | Core Dumps (4/4) | Completion Status [1/1] | Display configuration summary
      ansible.builtin.debug:
        msg:
          - "  Core dumps configuration completed successfully"
          - "  Core dumps disabled: {{ iac__bootstrap__core_dumps__disable | bool }}"
          - "  Limits file: {{ iac__bootstrap__core_dumps__limits_file }}"
          - "  Sysctl file: {{ iac__bootstrap__core_dumps__sysctl_file }}"
