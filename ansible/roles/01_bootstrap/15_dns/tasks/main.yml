---
# =============================================================================
# Role: 15_dns
# =============================================================================
# Configures dnsmasq for local DNS caching and wildcard resolution.
# Provides automatic DNS entries from Ansible inventory groups.
# =============================================================================

# =============================================================================
# Section 0/4: Preconditions - Handle Removal
# =============================================================================

- name: Bootstrap | DNS (0/4) | Preconditions | Handle removal
  when:
    - not (iac__bootstrap__dns__skip | bool)
    - iac__bootstrap__dns__remove | bool
  block:
    - name: Bootstrap | DNS (0/4) | Preconditions [1/5] | Stop dnsmasq service
      ansible.builtin.service:
        name: dnsmasq
        state: stopped
        enabled: false
      failed_when: false

    - name: Bootstrap | DNS (0/4) | Preconditions [2/5] | Remove dnsmasq configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/dnsmasq.d/00-infrastructure.conf
        - /etc/dnsmasq.d/01-local-hosts.conf
        - /etc/systemd/system/dnsmasq.service.d/restart.conf

    - name: Bootstrap | DNS (0/4) | Preconditions [3/5] | Restore resolv.conf
      ansible.builtin.copy:
        content: |
          # Restored by Ansible
          {% for server in iac__bootstrap__dns__upstream_servers %}
          nameserver {{ server }}
          {% endfor %}
        dest: /etc/resolv.conf
        mode: "0644"

    - name: Bootstrap | DNS (0/4) | Preconditions [4/5] | Remove DHCP override
      ansible.builtin.lineinfile:
        path: /etc/dhcp/dhclient.conf
        line: 'supersede domain-name-servers 127.0.0.1;'
        state: absent
      failed_when: false

    - name: Bootstrap | DNS (0/4) | Preconditions [5/5] | Display removal status
      ansible.builtin.debug:
        msg:
          - "  DNS (dnsmasq) removal completed"
          - "  Service stopped and disabled"
          - "  Configuration files removed"
          - "  resolv.conf restored"

# =============================================================================
# Section 1/4: Validation
# =============================================================================

- name: Bootstrap | DNS (1/4) | Validation | Validate inputs
  when:
    - not (iac__bootstrap__dns__skip | bool)
    - not (iac__bootstrap__dns__remove | bool)
  block:
    - name: Bootstrap | DNS (1/4) | Validation [1/2] | Assert upstream servers defined
      ansible.builtin.assert:
        that:
          - iac__bootstrap__dns__upstream_servers is defined
          - iac__bootstrap__dns__upstream_servers | length > 0
        fail_msg: "At least one upstream DNS server must be defined"
        quiet: true
      changed_when: false

    - name: Bootstrap | DNS (1/4) | Validation [2/2] | Assert inventory group exists if specified
      ansible.builtin.assert:
        that:
          - iac__bootstrap__dns__inventory_group in groups
        fail_msg: "Inventory group '{{ iac__bootstrap__dns__inventory_group }}' does not exist"
        quiet: true
      when: iac__bootstrap__dns__inventory_group is not none
      changed_when: false

# =============================================================================
# Section 2/4: Main Tasks
# =============================================================================

- name: Bootstrap | DNS (2/4) | Main Tasks | Configure dnsmasq
  when:
    - not (iac__bootstrap__dns__skip | bool)
    - not (iac__bootstrap__dns__remove | bool)
  block:
    # -------------------------------------------------------------------------
    # Package Installation
    # -------------------------------------------------------------------------

    - name: Bootstrap | DNS (2/4) | Main Tasks [1/12] | Install dnsmasq
      ansible.builtin.package:
        name: dnsmasq
        state: present

    - name: Bootstrap | DNS (2/4) | Main Tasks [2/12] | Stop systemd-resolved
      ansible.builtin.service:
        name: systemd-resolved
        state: stopped
        enabled: false
      failed_when: false

    # -------------------------------------------------------------------------
    # Build DNS Entries
    # -------------------------------------------------------------------------

    - name: Bootstrap | DNS (2/4) | Main Tasks [3/12] | Build inventory DNS entries
      ansible.builtin.set_fact:
        __iac__bootstrap__dns__inventory_entries: |
          {% set entries = [] %}
          {% if iac__bootstrap__dns__inventory_group is not none %}
          {% for host in groups[iac__bootstrap__dns__inventory_group] | default([]) %}
          {% set host_ip = hostvars[host]['ansible_host'] | default(host) %}
          {% set _ = entries.append({'pattern': host, 'ip': host_ip}) %}
          {% if iac__bootstrap__dns__internal_domain | default('') | length > 0 %}
          {% set _ = entries.append({'pattern': host ~ '.' ~ iac__bootstrap__dns__internal_domain, 'ip': host_ip}) %}
          {% endif %}
          {% endfor %}
          {% endif %}
          {{ entries }}

    - name: Bootstrap | DNS (2/4) | Main Tasks [4/12] | Combine all DNS entries
      ansible.builtin.set_fact:
        __iac__bootstrap__dns__all_entries: "{{ __iac__bootstrap__dns__inventory_entries + (iac__bootstrap__dns__custom_entries | default([])) }}"

    # -------------------------------------------------------------------------
    # dnsmasq Configuration
    # -------------------------------------------------------------------------

    - name: Bootstrap | DNS (2/4) | Main Tasks [5/12] | Create dnsmasq config directory
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Bootstrap | DNS (2/4) | Main Tasks [6/12] | Configure dnsmasq main settings
      ansible.builtin.template:
        src: dnsmasq.conf.j2
        dest: /etc/dnsmasq.d/00-infrastructure.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart dnsmasq

    - name: Bootstrap | DNS (2/4) | Main Tasks [7/12] | Configure dnsmasq DNS entries
      ansible.builtin.template:
        src: dnsmasq-hosts.conf.j2
        dest: /etc/dnsmasq.d/01-local-hosts.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart dnsmasq

    # -------------------------------------------------------------------------
    # System DNS Configuration
    # -------------------------------------------------------------------------

    - name: Bootstrap | DNS (2/4) | Main Tasks [8/12] | Backup resolv.conf
      ansible.builtin.copy:
        src: /etc/resolv.conf
        dest: "/etc/resolv.conf.backup.{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        mode: "0644"
      when: iac__bootstrap__dns__backup_resolv_conf | bool
      changed_when: false

    - name: Bootstrap | DNS (2/4) | Main Tasks [9/12] | Check if resolv.conf is symlink
      ansible.builtin.stat:
        path: /etc/resolv.conf
      register: __iac__bootstrap__dns__resolv_stat

    - name: Bootstrap | DNS (2/4) | Main Tasks [10/12] | Remove resolv.conf symlink
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent
      when: __iac__bootstrap__dns__resolv_stat.stat.islnk | default(false)

    - name: Bootstrap | DNS (2/4) | Main Tasks [11/12] | Configure resolv.conf for dnsmasq
      ansible.builtin.copy:
        content: |
          # Managed by Ansible - Infrastructure DNS
          # Using local dnsmasq for DNS resolution
          nameserver 127.0.0.1
          options edns0 trust-ad
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"

    - name: Bootstrap | DNS (2/4) | Main Tasks [12/12] | Prevent DHCP DNS override
      ansible.builtin.lineinfile:
        path: /etc/dhcp/dhclient.conf
        line: 'supersede domain-name-servers 127.0.0.1;'
        create: true
        mode: "0644"
      when: iac__bootstrap__dns__prevent_dhcp_override | bool
      failed_when: false

    # -------------------------------------------------------------------------
    # Service Configuration
    # -------------------------------------------------------------------------

    - name: Bootstrap | DNS (2/4) | Main Tasks [13/13] | Create systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/dnsmasq.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Bootstrap | DNS (2/4) | Main Tasks [14/14] | Configure dnsmasq restart policy
      ansible.builtin.copy:
        src: dnsmasq-restart.conf
        dest: /etc/systemd/system/dnsmasq.service.d/restart.conf
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd
        - restart dnsmasq

    - name: Bootstrap | DNS (2/4) | Main Tasks [15/15] | Enable and start dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: started
        enabled: true

# =============================================================================
# Section 3/4: Result Validation
# =============================================================================

- name: Bootstrap | DNS (3/4) | Result Validation | Verify configuration
  when:
    - not (iac__bootstrap__dns__skip | bool)
    - not (iac__bootstrap__dns__remove | bool)
  block:
    - name: Bootstrap | DNS (3/4) | Result Validation [1/3] | Wait for dnsmasq ready
      ansible.builtin.wait_for:
        port: "{{ iac__bootstrap__dns__port }}"
        host: 127.0.0.1
        timeout: 30

    - name: Bootstrap | DNS (3/4) | Result Validation [2/3] | Test upstream DNS resolution
      ansible.builtin.command: dig +short google.com @127.0.0.1
      register: __iac__bootstrap__dns__upstream_test
      changed_when: false
      failed_when: false

    - name: Bootstrap | DNS (3/4) | Result Validation [3/3] | Assert DNS is operational
      ansible.builtin.assert:
        that:
          - __iac__bootstrap__dns__upstream_test.rc == 0
          - __iac__bootstrap__dns__upstream_test.stdout | length > 0
        fail_msg: "dnsmasq is not resolving external DNS queries"
        quiet: true

# =============================================================================
# Section 4/4: Completion Status
# =============================================================================

- name: Bootstrap | DNS (4/4) | Completion Status | Display summary
  when:
    - not (iac__bootstrap__dns__skip | bool)
    - not (iac__bootstrap__dns__remove | bool)
  block:
    - name: Bootstrap | DNS (4/4) | Completion Status [1/1] | Display configuration summary
      ansible.builtin.debug:
        msg:
          - "  DNS configuration completed"
          - "  Service: dnsmasq on port {{ iac__bootstrap__dns__port }}"
          - "  Upstream DNS: {{ iac__bootstrap__dns__upstream_servers | join(', ') }}"
          - "  Internal domain: {{ iac__bootstrap__dns__internal_domain | default('(none)') }}"
          - "  Inventory group: {{ iac__bootstrap__dns__inventory_group | default('(none - disabled)') }}"
          - "  Auto-discovered entries: {{ __iac__bootstrap__dns__inventory_entries | length }}"
          - "  Custom entries: {{ iac__bootstrap__dns__custom_entries | default([]) | length }}"
          - "  Total DNS entries: {{ __iac__bootstrap__dns__all_entries | length }}"
          - "  Cache size: {{ iac__bootstrap__dns__cache_size }}"
          - "  Max cache TTL: {{ iac__bootstrap__dns__max_cache_ttl }}s"
