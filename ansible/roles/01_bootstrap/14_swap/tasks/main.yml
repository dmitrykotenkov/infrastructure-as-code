---
# =============================================================================
# Role: 14_swap
# =============================================================================
# Configures swap file and swappiness settings for memory management.
# For Kubernetes nodes, set remove: true to disable swap completely.
# =============================================================================

# =============================================================================
# Section 0/4: Preconditions - Remove Swap (Kubernetes mode)
# =============================================================================

- name: Bootstrap | Swap (0/4) | Preconditions | Handle removal (Kubernetes mode)
  when:
    - not (iac__bootstrap__swap__skip | bool)
    - iac__bootstrap__swap__remove | bool
  block:
    - name: Bootstrap | Swap (0/4) | Preconditions [1/5] | Disable all swap
      ansible.builtin.command: swapoff -a
      register: __iac__bootstrap__swap__swapoff_result
      changed_when: __iac__bootstrap__swap__swapoff_result.rc == 0
      failed_when: false

    - name: Bootstrap | Swap (0/4) | Preconditions [2/5] | Remove all swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '\s+swap\s+'
        state: absent
        backup: true

    - name: Bootstrap | Swap (0/4) | Preconditions [3/5] | Remove swap file if exists
      ansible.builtin.file:
        path: "{{ iac__bootstrap__swap__file_path }}"
        state: absent

    - name: Bootstrap | Swap (0/4) | Preconditions [4/5] | Remove swappiness config
      ansible.builtin.file:
        path: /etc/sysctl.d/99-swappiness.conf
        state: absent

    - name: Bootstrap | Swap (0/4) | Preconditions [5/5] | Display removal status
      ansible.builtin.debug:
        msg:
          - "  Swap has been completely disabled"
          - "  All swap devices: disabled"
          - "  fstab swap entries: removed"
          - "  Swap file: removed"

# =============================================================================
# Section 1/4: Validation
# =============================================================================

- name: Bootstrap | Swap (1/4) | Validation | Validate swap configuration
  when:
    - not (iac__bootstrap__swap__skip | bool)
    - not (iac__bootstrap__swap__remove | bool)
  block:
    - name: Bootstrap | Swap (1/4) | Validation [1/2] | Assert swap file path is valid
      ansible.builtin.assert:
        that:
          - iac__bootstrap__swap__file_path is defined
          - iac__bootstrap__swap__file_path | length > 0
          - iac__bootstrap__swap__file_path is regex("^/")
        fail_msg: "Swap file path must be an absolute path"
        quiet: true
      changed_when: false

    - name: Bootstrap | Swap (1/4) | Validation [2/2] | Assert swappiness is valid
      ansible.builtin.assert:
        that:
          - (iac__bootstrap__swap__swappiness | int) >= 0
          - (iac__bootstrap__swap__swappiness | int) <= 100
        fail_msg: "Swappiness must be between 0 and 100"
        quiet: true
      changed_when: false

# =============================================================================
# Section 2/4: Main Tasks
# =============================================================================

- name: Bootstrap | Swap (2/4) | Main Tasks | Configure swap
  when:
    - not (iac__bootstrap__swap__skip | bool)
    - not (iac__bootstrap__swap__remove | bool)
  block:
    # -------------------------------------------------------------------------
    # Detect Current Swap State
    # -------------------------------------------------------------------------

    - name: Bootstrap | Swap (2/4) | Main Tasks [1/10] | Detect active swap devices
      ansible.builtin.command: swapon --noheadings --show=NAME
      register: __iac__bootstrap__swap__active_devices
      changed_when: false
      failed_when: false

    - name: Bootstrap | Swap (2/4) | Main Tasks [2/10] | Set swap presence fact
      ansible.builtin.set_fact:
        __iac__bootstrap__swap__any_active: "{{ (__iac__bootstrap__swap__active_devices.stdout | trim | length) > 0 }}"

    - name: Bootstrap | Swap (2/4) | Main Tasks [3/10] | Check if swap file exists
      ansible.builtin.stat:
        path: "{{ iac__bootstrap__swap__file_path }}"
      register: __iac__bootstrap__swap__file_stat

    # -------------------------------------------------------------------------
    # Create Swap File
    # -------------------------------------------------------------------------

    - name: Bootstrap | Swap (2/4) | Main Tasks [4/10] | Create swap file
      community.general.filesize:
        path: "{{ iac__bootstrap__swap__file_path }}"
        size: "{{ iac__bootstrap__swap__file_size }}"
        mode: "0600"
        owner: root
        group: root
      when:
        - not __iac__bootstrap__swap__any_active
        - not __iac__bootstrap__swap__file_stat.stat.exists

    - name: Bootstrap | Swap (2/4) | Main Tasks [5/10] | Refresh swap file stat
      ansible.builtin.stat:
        path: "{{ iac__bootstrap__swap__file_path }}"
      register: __iac__bootstrap__swap__file_stat_after

    # -------------------------------------------------------------------------
    # Format and Enable Swap
    # -------------------------------------------------------------------------

    - name: Bootstrap | Swap (2/4) | Main Tasks [6/10] | Detect swap file signature
      ansible.builtin.command: "blkid -o value -s TYPE {{ iac__bootstrap__swap__file_path }}"
      register: __iac__bootstrap__swap__file_type
      changed_when: false
      failed_when: false
      when: __iac__bootstrap__swap__file_stat_after.stat.exists

    - name: Bootstrap | Swap (2/4) | Main Tasks [7/10] | Format swap file
      community.general.filesystem:
        fstype: swap
        dev: "{{ iac__bootstrap__swap__file_path }}"
      when:
        - __iac__bootstrap__swap__file_stat_after.stat.exists
        - (__iac__bootstrap__swap__file_type.stdout | default('') | trim) != "swap"

    - name: Bootstrap | Swap (2/4) | Main Tasks [8/10] | Add swap to fstab
      ansible.builtin.mount:
        name: none
        src: "{{ iac__bootstrap__swap__file_path }}"
        fstype: swap
        opts: sw
        state: present
      when: __iac__bootstrap__swap__file_stat_after.stat.exists

    - name: Bootstrap | Swap (2/4) | Main Tasks [9/10] | Enable swap file
      ansible.builtin.command: "swapon {{ iac__bootstrap__swap__file_path }}"
      register: __iac__bootstrap__swap__swapon_result
      changed_when: __iac__bootstrap__swap__swapon_result.rc == 0
      failed_when: false
      when:
        - __iac__bootstrap__swap__file_stat_after.stat.exists
        - not __iac__bootstrap__swap__any_active

    # -------------------------------------------------------------------------
    # Configure Swappiness
    # -------------------------------------------------------------------------

    - name: Bootstrap | Swap (2/4) | Main Tasks [10/10] | Set vm.swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ iac__bootstrap__swap__swappiness | string }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-swappiness.conf
        reload: true

# =============================================================================
# Section 3/4: Result Validation
# =============================================================================

- name: Bootstrap | Swap (3/4) | Result Validation | Verify swap configuration
  when:
    - not (iac__bootstrap__swap__skip | bool)
    - not (iac__bootstrap__swap__remove | bool)
  block:
    - name: Bootstrap | Swap (3/4) | Result Validation [1/3] | Get active swap info
      ansible.builtin.command: swapon --show
      register: __iac__bootstrap__swap__final_status
      changed_when: false
      failed_when: false

    - name: Bootstrap | Swap (3/4) | Result Validation [2/3] | Get current swappiness
      ansible.builtin.command: cat /proc/sys/vm/swappiness
      register: __iac__bootstrap__swap__current_swappiness
      changed_when: false

    - name: Bootstrap | Swap (3/4) | Result Validation [3/3] | Assert swap is configured
      ansible.builtin.assert:
        that:
          - (__iac__bootstrap__swap__current_swappiness.stdout | int) == (iac__bootstrap__swap__swappiness | int)
        fail_msg: "Swappiness value mismatch"
        quiet: true

# =============================================================================
# Section 4/4: Completion Status
# =============================================================================

- name: Bootstrap | Swap (4/4) | Completion Status | Display configuration summary
  when:
    - not (iac__bootstrap__swap__skip | bool)
    - not (iac__bootstrap__swap__remove | bool)
  block:
    - name: Bootstrap | Swap (4/4) | Completion Status [1/1] | Display configuration summary
      ansible.builtin.debug:
        msg:
          - "  Swap configuration completed"
          - "  Swap file: {{ iac__bootstrap__swap__file_path }}"
          - "  Swap size: {{ iac__bootstrap__swap__file_size }}"
          - "  Swappiness: {{ __iac__bootstrap__swap__current_swappiness.stdout }}"
          - "  Active swap:"
          - "{{ __iac__bootstrap__swap__final_status.stdout | default('  (none)') | indent(4, first=true) }}"
