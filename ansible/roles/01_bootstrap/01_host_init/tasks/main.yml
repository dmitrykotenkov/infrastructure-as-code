---
# =============================================================================
# Role: 01_host_init
# =============================================================================
# Sets basic host identity: hostname, timezone, and NTP synchronization.
# This is a fast, non-disruptive role that should run first.
# =============================================================================

# =============================================================================
# Section 1/4: Validation
# =============================================================================

- name: Bootstrap | Host Init (1/4) | Validation | Validate inputs
  when: not (iac__bootstrap__host_init__skip | bool)
  block:
    - name: Bootstrap | Host Init (1/4) | Validation [1/2] | Assert hostname is defined
      ansible.builtin.assert:
        that:
          - iac__bootstrap__host_init__hostname is defined
          - (iac__bootstrap__host_init__hostname | string | length) > 0
        fail_msg: "iac__bootstrap__host_init__hostname must be defined and non-empty"
        quiet: true
      changed_when: false

    - name: Bootstrap | Host Init (1/4) | Validation [2/2] | Assert timezone is defined
      ansible.builtin.assert:
        that:
          - iac__bootstrap__host_init__timezone is defined
          - (iac__bootstrap__host_init__timezone | string | length) > 0
        fail_msg: "iac__bootstrap__host_init__timezone must be defined and non-empty"
        quiet: true
      changed_when: false

# =============================================================================
# Section 2/4: Main Tasks
# =============================================================================

- name: Bootstrap | Host Init (2/4) | Main Tasks | Configure host
  when: not (iac__bootstrap__host_init__skip | bool)
  block:
    # -------------------------------------------------------------------------
    # Hostname Configuration
    # -------------------------------------------------------------------------

    - name: Bootstrap | Host Init (2/4) | Main Tasks [1/7] | Set system hostname
      ansible.builtin.hostname:
        name: "{{ iac__bootstrap__host_init__hostname }}"

    - name: Bootstrap | Host Init (2/4) | Main Tasks [2/7] | Ensure localhost entry in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.0\.1\s+localhost'
        line: "127.0.0.1 localhost"
        state: present
        insertbefore: BOF
        backup: true

    - name: Bootstrap | Host Init (2/4) | Main Tasks [3/7] | Update /etc/hosts with hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+'
        line: "127.0.1.1 {{ iac__bootstrap__host_init__hostname }}"
        state: present
        backup: true

    # -----------------------------------------------------------------------------
    # Timezone Configuration
    # -----------------------------------------------------------------------------

    - name: Bootstrap | Host Init (2/4) | Main Tasks [4/7] | Set system timezone
      community.general.timezone:
        name: "{{ iac__bootstrap__host_init__timezone }}"

    # -----------------------------------------------------------------------------
    # NTP Configuration
    # -----------------------------------------------------------------------------

    - name: Bootstrap | Host Init (2/4) | Main Tasks [5/7] | Check current NTP status
      ansible.builtin.command: timedatectl show --property=NTP --value
      register: __iac__bootstrap__host_init__ntp_status
      changed_when: false
      failed_when: false

    - name: Bootstrap | Host Init (2/4) | Main Tasks [6/7] | Enable NTP time synchronization
      ansible.builtin.command: timedatectl set-ntp true
      when:
        - iac__bootstrap__host_init__ntp_enabled | bool
        - __iac__bootstrap__host_init__ntp_status.stdout | default('no') != 'yes'
      changed_when: true

    - name: Bootstrap | Host Init (2/4) | Main Tasks [7/7] | Disable NTP time synchronization
      ansible.builtin.command: timedatectl set-ntp false
      when:
        - not (iac__bootstrap__host_init__ntp_enabled | bool)
        - __iac__bootstrap__host_init__ntp_status.stdout | default('no') == 'yes'
      changed_when: true

# =============================================================================
# Section 3/4: Result Validation
# =============================================================================

- name: Bootstrap | Host Init (3/4) | Result Validation | Verify configuration
  when: not (iac__bootstrap__host_init__skip | bool)
  block:
    - name: Bootstrap | Host Init (3/4) | Result Validation [1/3] | Verify hostname is set
      ansible.builtin.command: hostname
      register: __iac__bootstrap__host_init__hostname_check
      changed_when: false
      failed_when: __iac__bootstrap__host_init__hostname_check.stdout != iac__bootstrap__host_init__hostname

    - name: Bootstrap | Host Init (3/4) | Result Validation [2/3] | Verify timezone is set
      ansible.builtin.command: timedatectl show --property=Timezone --value
      register: __iac__bootstrap__host_init__tz_check
      changed_when: false
      failed_when: __iac__bootstrap__host_init__tz_check.stdout != iac__bootstrap__host_init__timezone

    - name: Bootstrap | Host Init (3/4) | Result Validation [3/3] | Verify NTP status
      ansible.builtin.command: timedatectl show --property=NTP --value
      register: __iac__bootstrap__host_init__ntp_check
      changed_when: false
      failed_when: >-
        (iac__bootstrap__host_init__ntp_enabled | bool and __iac__bootstrap__host_init__ntp_check.stdout != 'yes') or
        (not (iac__bootstrap__host_init__ntp_enabled | bool) and __iac__bootstrap__host_init__ntp_check.stdout != 'no')

# =============================================================================
# Section 4/4: Completion Status
# =============================================================================

- name: Bootstrap | Host Init (4/4) | Completion Status | Display summary
  when: not (iac__bootstrap__host_init__skip | bool)
  block:
    - name: Bootstrap | Host Init (4/4) | Completion Status [1/1] | Display configuration summary
      ansible.builtin.debug:
        msg:
          - "  Host initialization completed successfully"
          - "  Hostname: {{ iac__bootstrap__host_init__hostname }}"
          - "  Timezone: {{ __iac__bootstrap__host_init__tz_check.stdout }}"
          - "  NTP enabled: {{ __iac__bootstrap__host_init__ntp_check.stdout }}"
