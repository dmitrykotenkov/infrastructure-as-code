---
# =============================================================================
# Role: 13_fail2ban
# =============================================================================
# Configures Fail2Ban intrusion prevention system to protect SSH and other
# services from brute-force attacks by banning offending IP addresses.
# =============================================================================

# =============================================================================
# Section 0/4: Preconditions
# =============================================================================

- name: Bootstrap | Fail2Ban (0/4) | Preconditions [1/2] | Skip role if disabled
  ansible.builtin.meta: end_host
  when: iac__bootstrap__fail2ban__skip | bool

- name: Bootstrap | Fail2Ban (0/4) | Preconditions [2/2] | Handle removal
  when: iac__bootstrap__fail2ban__remove | bool
  block:
    - name: Bootstrap | Fail2Ban (0/4) | Preconditions [2a/2] | Stop fail2ban service
      ansible.builtin.service:
        name: fail2ban
        state: stopped
        enabled: false
      failed_when: false

    - name: Bootstrap | Fail2Ban (0/4) | Preconditions [2b/2] | Remove jail configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/fail2ban/jail.d/10-defaults.local
        - /etc/fail2ban/jail.d/20-sshd.local
        - /etc/fail2ban/jail.d/30-nginx.local
        - /etc/fail2ban/jail.d/90-custom.local

    - name: Bootstrap | Fail2Ban (0/4) | Preconditions [2c/2] | End host after removal
      ansible.builtin.meta: end_host

# =============================================================================
# Section 1/4: Validation
# =============================================================================

- name: Bootstrap | Fail2Ban (1/4) | Validation [1/2] | Assert SSH port is valid
  ansible.builtin.assert:
    that:
      - iac__bootstrap__fail2ban__ssh_port is defined
      - (iac__bootstrap__fail2ban__ssh_port | int) > 0
      - (iac__bootstrap__fail2ban__ssh_port | int) < 65536
    fail_msg: "SSH port must be between 1 and 65535"
    quiet: true
  changed_when: false

- name: Bootstrap | Fail2Ban (1/4) | Validation [2/2] | Assert retry values are valid
  ansible.builtin.assert:
    that:
      - (iac__bootstrap__fail2ban__ssh_maxretry | int) > 0
      - (iac__bootstrap__fail2ban__default_maxretry | int) > 0
    fail_msg: "Max retry values must be positive integers"
    quiet: true
  changed_when: false

# =============================================================================
# Section 2/4: Main Tasks
# =============================================================================

# -----------------------------------------------------------------------------
# Package Installation
# -----------------------------------------------------------------------------

- name: Bootstrap | Fail2Ban (2/4) | Main Tasks [1/6] | Install fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present

# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------

- name: Bootstrap | Fail2Ban (2/4) | Main Tasks [2/6] | Configure default settings
  ansible.builtin.template:
    src: defaults.local.j2
    dest: /etc/fail2ban/jail.d/10-defaults.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Bootstrap | Fail2Ban (2/4) | Main Tasks [3/6] | Configure SSH jail
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/20-sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Bootstrap | Fail2Ban (2/4) | Main Tasks [4/6] | Configure nginx jails
  ansible.builtin.template:
    src: nginx.local.j2
    dest: /etc/fail2ban/jail.d/30-nginx.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban
  when: iac__bootstrap__fail2ban__nginx_enabled | bool

- name: Bootstrap | Fail2Ban (2/4) | Main Tasks [5/6] | Configure custom jails
  ansible.builtin.template:
    src: custom.local.j2
    dest: /etc/fail2ban/jail.d/90-custom.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban
  when: iac__bootstrap__fail2ban__custom_jails | length > 0

# -----------------------------------------------------------------------------
# Service Management
# -----------------------------------------------------------------------------

- name: Bootstrap | Fail2Ban (2/4) | Main Tasks [6/6] | Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# =============================================================================
# Section 3/4: Result Validation
# =============================================================================

- name: Bootstrap | Fail2Ban (3/4) | Result Validation [1/3] | Verify service is running
  ansible.builtin.command: systemctl is-active fail2ban
  register: __iac__bootstrap__fail2ban__service_status
  changed_when: false
  failed_when: false

- name: Bootstrap | Fail2Ban (3/4) | Result Validation [2/3] | Check jail status
  ansible.builtin.command: fail2ban-client status sshd
  register: __iac__bootstrap__fail2ban__sshd_status
  changed_when: false
  failed_when: false

- name: Bootstrap | Fail2Ban (3/4) | Result Validation [3/3] | Assert fail2ban is operational
  ansible.builtin.assert:
    that:
      - __iac__bootstrap__fail2ban__service_status.stdout == "active"
      - __iac__bootstrap__fail2ban__sshd_status.rc == 0
    fail_msg: "Fail2Ban is not running or SSH jail failed to load"
    quiet: true
  changed_when: false

# =============================================================================
# Section 4/4: Completion Status
# =============================================================================

- name: Bootstrap | Fail2Ban (4/4) | Completion Status [1/1] | Display configuration summary
  ansible.builtin.debug:
    msg:
      - "  Fail2ban configuration completed"
      - "  Service status: {{ __iac__bootstrap__fail2ban__service_status.stdout }}"
      - "  SSH jail: enabled on port {{ iac__bootstrap__fail2ban__ssh_port }}"
      - "  SSH settings:"
      - "    - Max retries: {{ iac__bootstrap__fail2ban__ssh_maxretry }}"
      - "    - Find time: {{ iac__bootstrap__fail2ban__ssh_findtime }}"
      - "    - Ban time: {{ iac__bootstrap__fail2ban__ssh_bantime }}"
      - "  Nginx jails: {{ iac__bootstrap__fail2ban__nginx_enabled | bool | ternary('enabled', 'disabled') }}"
      - "  Custom jails: {{ iac__bootstrap__fail2ban__custom_jails | length }}"
