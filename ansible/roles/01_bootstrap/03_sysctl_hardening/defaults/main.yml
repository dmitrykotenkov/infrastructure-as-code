---
# =============================================================================
# Optional variables (can be overridden at playbook or inventory level)
# =============================================================================
iac__bootstrap__sysctl_hardening__skip: false
iac__bootstrap__sysctl_hardening__config_file: /etc/sysctl.d/99-ansible-security.conf

iac__bootstrap__sysctl_hardening__network_params:
  # IP Forwarding - REQUIRED for Kubernetes (non-K8s default: "0")
  - { name: "net.ipv4.ip_forward", value: "1" }
  - { name: "net.ipv6.conf.all.forwarding", value: "1" }

  # ICMP Redirects (prevent MITM attacks)
  - { name: "net.ipv4.conf.all.accept_redirects", value: "0" }
  - { name: "net.ipv4.conf.default.accept_redirects", value: "0" }
  - { name: "net.ipv6.conf.all.accept_redirects", value: "0" }
  - { name: "net.ipv6.conf.default.accept_redirects", value: "0" }
  - { name: "net.ipv4.conf.all.send_redirects", value: "0" }
  - { name: "net.ipv4.conf.default.send_redirects", value: "0" }

  # Source Route Verification (prevent IP spoofing) 
  - { name: "net.ipv4.conf.all.rp_filter", value: "1" }
  - { name: "net.ipv4.conf.default.rp_filter", value: "1" }

  # Source-Routed Packets (ignore suspicious packets) 
  - { name: "net.ipv4.conf.all.accept_source_route", value: "0" }
  - { name: "net.ipv4.conf.default.accept_source_route", value: "0" }
  - { name: "net.ipv6.conf.all.accept_source_route", value: "0" }
  - { name: "net.ipv6.conf.default.accept_source_route", value: "0" }

  # Martian Packets Logging (log spoofed/malformed packets) 
  - { name: "net.ipv4.conf.all.log_martians", value: "1" }
  - { name: "net.ipv4.conf.default.log_martians", value: "1" }

  # ICMP Broadcast Protection (prevent smurf attacks) 
  - { name: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
  - { name: "net.ipv4.icmp_ignore_bogus_error_responses", value: "1" }

  # TCP SYN Cookies (SYN flood protection) 
  - { name: "net.ipv4.tcp_syncookies", value: "1" }

  # IPv6 Router Advertisements (disable if not using IPv6) 
  - { name: "net.ipv6.conf.all.accept_ra", value: "0" }
  - { name: "net.ipv6.conf.default.accept_ra", value: "0" }

  # TCP Timestamps (disable to prevent uptime fingerprinting) 
  - { name: "net.ipv4.tcp_timestamps", value: "0" }

  # TCP SYN Backlog (increase for SYN flood protection) 
  # Larger queue allows more half-open connections during attacks
  - { name: "net.ipv4.tcp_max_syn_backlog", value: "4096" }

  # Socket Connection Queue (increase for high-traffic servers) 
  # Maximum number of pending connections in listen queue
  - { name: "net.core.somaxconn", value: "65535" }

iac__bootstrap__sysctl_hardening__kernel_params:
  # Kernel Log Access (restrict dmesg to root) 
  - { name: "kernel.dmesg_restrict", value: "1" }

  # Kernel Pointer Hiding (hide memory addresses) 
  - { name: "kernel.kptr_restrict", value: "2" }

  # Ptrace Restriction (limit process tracing) 
  - { name: "kernel.yama.ptrace_scope", value: "1" }

  # Magic SysRq Key (disable dangerous keyboard shortcuts) 
  - { name: "kernel.sysrq", value: "0" }

iac__bootstrap__sysctl_hardening__memory_params:
  # ASLR (Address Space Layout Randomization) 
  # 2 = full randomization (stack, VDSO, shared memory, data)
  - { name: "kernel.randomize_va_space", value: "2" }

  # Minimum Virtual Memory Address (NULL pointer dereference protection) 
  # Prevents userspace programs from mapping low addresses
  # Protects against NULL pointer dereference exploits in kernel
  - { name: "vm.mmap_min_addr", value: "65536" }

# Add custom sysctl parameters here (merged with defaults)
iac__bootstrap__sysctl_hardening__extra_params: []
