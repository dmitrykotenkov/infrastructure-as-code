---
- name: Bootstrap | Preflight
  hosts: bootstrap_targets
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/vars/initial_ssh_auth.yml"

  pre_tasks:
    - name: Bootstrap | Preflight (0/1) | Pre-Tasks [1/1] | Set password auth if configured
      ansible.builtin.set_fact:
        ansible_password: "{{ vault__initial_ansible_user_initial_password__list.get(inventory_hostname) }}"
      when: initial_auth_has_password | bool

    - name: Bootstrap | Preflight (0/1) | Pre-Tasks [2/6] | Set SSH key auth if configured
      ansible.builtin.set_fact:
        iac__shared__ensure_ssh_key_file__ansible_ssh_private_key: "{{ vault__initial_ansible_user_initial_ssh_key__list.get(inventory_hostname) }}"
        ansible_ssh_private_key_file: "{{ iac__common__ansible_ssh_private_key_file }}"
      when: initial_auth_has_ssh_key | bool

    - name: Bootstrap | Preflight (0/1) | Pre-Tasks [3/6] | Validate auth method 
      ansible.builtin.include_role:
        name: _shared/_validate_auth_method

    - name: Bootstrap | Preflight (0/1) | Pre-Tasks [4/6] | Ensure SSH private key file if needed
      ansible.builtin.include_role:
        name: _shared/_ensure_ssh_key_file
    
    - name: Bootstrap | Preflight (0/1) | Pre-Tasks [5/6] | Sync known_hosts for initial ansible port
      ansible.builtin.include_role:
        name: _shared/_sync_known_hosts

    - name: Bootstrap | Preflight (0/1) | Pre-Tasks [6/6] | Gather facts
      ansible.builtin.setup:

  tasks:
    - name: Bootstrap | Preflight (1/1) | Main Tasks [1/1] | Verify SSH connectivity
      ansible.builtin.debug:
        msg: "Connection established to {{ inventory_hostname }} ({{ ansible_host }})"
