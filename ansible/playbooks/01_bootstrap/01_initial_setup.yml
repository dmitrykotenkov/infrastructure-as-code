---
- name: Bootstrap | Initial Setup (0/1) | Preflight
  ansible.builtin.import_playbook: 00_preflight.yml

- name: Bootstrap | Initial Setup (1/1) | Main Tasks
  hosts: bootstrap_targets
  gather_facts: false
  become: true
  vars:
    ansible_become: true
    ansible_become_method: sudo
  vars_files:
    - "{{ playbook_dir }}/vars/initial_ssh_auth.yml"

  tasks:
    - name: Bootstrap | Initial Setup (1/1) | Main Tasks [1/2] | 01 Host Init
      ansible.builtin.include_role:
        name: 01_bootstrap/01_host_init

    - name: Bootstrap | Initial Setup (1/1) | Main Tasks [2/2] | 02 Packages
      ansible.builtin.include_role:
        name: 01_bootstrap/02_packages
