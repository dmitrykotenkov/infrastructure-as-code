---
- name: Bootstrap | Initial Setup (0/1) | Preflight
  ansible.builtin.import_playbook: 00_preflight.yml

- name: Bootstrap | Initial Setup (1/1) | Main Tasks
  hosts: bootstrap_targets
  gather_facts: false
  become: true
  vars:
    ansible_become: true
    ansible_become_method: sudo
  vars_files:
    - "{{ playbook_dir }}/vars/initial_ssh_auth.yml"

  tasks:
    - name: Bootstrap | Initial Setup (1/1) | Main Tasks [1/-] | 01 Host Init
      ansible.builtin.include_role:
        name: 01_bootstrap/01_host_init

    - name: Bootstrap | Initial Setup (1/1) | Main Tasks [2/-] | 02 Packages
      ansible.builtin.include_role:
        name: 01_bootstrap/02_packages

    - name: Bootstrap | Initial Setup (1/1) | Main Tasks [3/-] | 03 sysctl Hardening
      ansible.builtin.include_role:
        name: 01_bootstrap/03_sysctl_hardening

    - name: Bootstrap | Initial Setup (1/1) | Main Tasks [4/-] | 04 Core Dumps
      ansible.builtin.include_role:
        name: 01_bootstrap/04_core_dumps

    - name: Bootstrap | Initial Setup (1/1) | Main Tasks [5/-] | 05 Shell Security
      ansible.builtin.include_role:
        name: 01_bootstrap/05_shell_security

    - name: Bootstrap | Initial Setup (1/1) | Main Tasks [6/-] | 06 Filesystem Hardening
      ansible.builtin.include_role:
        name: 01_bootstrap/06_filesystem_hardening

    - name: Bootstrap | Initial Setup (1/1) | Main Tasks [7/-] | 07 AppArmor
      ansible.builtin.include_role:
        name: 01_bootstrap/07_apparmor
