---
- name: Bootstrap | Initial Setup (0/1) | Initial Setup Preflight
  tags: ['bootstrap', 'initial_setup_preflight']
  ansible.builtin.import_playbook: "{{ playbook_dir }}/../_shared/_preflight.yml"
  vars:
    ansible_port: "{{ vault__initial_ansible_port__list.get(inventory_hostname, iac__common__ssh_port) }}"
    ansible_user: "{{ vault__initial_ansible_user__list.get(inventory_hostname, iac__common__ssh_user) }}"
    ansible_password: "{{ vault__initial_ansible_user_initial_password__list.get(inventory_hostname) }}"
    iac__shared__preflight__auth_ssh_key: "{{ vault__initial_ansible_user_initial_ssh_key__list.get(inventory_hostname) }}"

- name: Bootstrap | Initial Setup (1/-) | Main Tasks
  hosts: bootstrap_targets
  gather_facts: false
  become: true
  tags: ['bootstrap', 'initial_setup']
  vars:
    ansible_become: true
    ansible_become_method: sudo
  vars_files:
    - "{{ playbook_dir }}/vars/initial_ssh_connection.yml"
  pre_tasks:
    - name: Bootstrap | Initial Setup (1/-) | Pre Tasks [1/1] | Refresh SSH connection
      ansible.builtin.include_role:
        name: _shared/_refresh_connection
  tasks:
    - name: Bootstrap | Initial Setup (1/-) | Main Tasks [1/8] | 01 Host Init
      ansible.builtin.include_role:
        name: 01_bootstrap/01_host_init
    - name: Bootstrap | Initial Setup (1/-) | Main Tasks [2/8] | 02 Packages
      ansible.builtin.include_role:
        name: 01_bootstrap/02_packages
    - name: Bootstrap | Initial Setup (1/-) | Main Tasks [3/8] | 03 sysctl Hardening
      ansible.builtin.include_role:
        name: 01_bootstrap/03_sysctl_hardening
    - name: Bootstrap | Initial Setup (1/-) | Main Tasks [4/8] | 04 Core Dumps
      ansible.builtin.include_role:
        name: 01_bootstrap/04_core_dumps
    - name: Bootstrap | Initial Setup (1/-) | Main Tasks [5/8] | 05 Shell Security
      ansible.builtin.include_role:
        name: 01_bootstrap/05_shell_security
    - name: Bootstrap | Initial Setup (1/-) | Main Tasks [6/8] | 06 Filesystem Hardening
      ansible.builtin.include_role:
        name: 01_bootstrap/06_filesystem_hardening
    - name: Bootstrap | Initial Setup (1/-) | Main Tasks [7/8] | 07 AppArmor
      ansible.builtin.include_role:
        name: 01_bootstrap/07_apparmor
    - name: Bootstrap | Initial Setup (1/-) | Main Tasks [8/8] | 08 Dist Upgrade
      ansible.builtin.include_role:
        name: 01_bootstrap/08_dist_upgrade
      vars:
        iac__bootstrap__dist_upgrade__enabled: true

- name: Bootstrap | User Setup (2/-) | Main Tasks
  hosts: bootstrap_targets
  gather_facts: false
  become: true
  tags: ['bootstrap', 'user_setup']
  vars:
    ansible_become: true
    ansible_become_method: sudo
  vars_files:
    - "{{ playbook_dir }}/vars/initial_ssh_connection.yml"
  pre_tasks:
    - name: Bootstrap | Initial Setup (2/-) | Pre Tasks [1/1] | Refresh SSH connection
      ansible.builtin.include_role:
        name: _shared/_refresh_connection
  tasks:
    - name: Bootstrap | SSH Setup (2/-) | Main Tasks [1/3] | 09 PAM Hardening
      ansible.builtin.include_role:
        name: 01_bootstrap/09_pam_hardening
    - name: Bootstrap | User Setup (2/-) | Main Tasks [2/3] | Add New User
      ansible.builtin.include_role:
        name: _shared/_add_new_user
      vars:
        iac__shared__add_new_user__username: "{{ vault__ansible_user__list.get(inventory_hostname) }}"
        iac__shared__add_new_user__password: "{{ vault__ansible_user_password__list.get(inventory_hostname) }}"
        iac__shared__add_new_user__ssh_public_key: "{{ vault__ansible_user_ssh_public_key__list.get(inventory_hostname) }}"
        iac__shared__add_new_user__sudo: true
        iac__shared__add_new_user__sudo_nopasswd: true
    - name: Bootstrap | User Setup (2/-) | Main Tasks [3/3] | Update Current User
      ansible.builtin.include_role:
        name: _shared/_update_current_user
      vars:
        iac__shared__update_current_user__password: "{{ vault__initial_ansible_user_password__list.get(inventory_hostname) }}"
        iac__shared__update_current_user__ssh_public_key: "{{ vault__initial_ansible_user_ssh_public_key__list.get(inventory_hostname) }}"

- name: Bootstrap | Initial Setup (3/-) | Post User Setup Preflight
  ansible.builtin.import_playbook:  "{{ playbook_dir }}/../_shared/_preflight.yml"
  tags: ['bootstrap', 'post_user_setup_preflight']
  vars:
    ansible_port: "{{ vault__initial_ansible_port__list.get(inventory_hostname, iac__common__ssh_port) }}"

