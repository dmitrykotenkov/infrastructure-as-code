---
- name: Bootstrap | Run (1/11) | Initial Preflight
  tags: ['bootstrap', 'run', 'initial_setup_preflight']
  ansible.builtin.import_playbook: "{{ playbook_dir }}/../_shared/_preflight.yml"
  vars:
    ansible_port: "{{ vault__initial_ansible_port__list.get(inventory_hostname, iac__common__ssh_port) }}"
    ansible_user: "{{ vault__initial_ansible_user__list.get(inventory_hostname, iac__common__ssh_user) }}"
    ansible_password: "{{ vault__initial_ansible_user_initial_password__list.get(inventory_hostname) }}"
    iac__shared__preflight__auth_ssh_key: "{{ vault__initial_ansible_user_initial_ssh_key__list.get(inventory_hostname) }}"

- name: Bootstrap | Run (2/11) | Initial Setup
  hosts: bootstrap_targets
  become: true
  tags: ['bootstrap', 'run', 'initial_setup']
  vars_files:
    - "{{ playbook_dir }}/vars/initial_ssh_connection.yml"
  pre_tasks:
    - name: Bootstrap | Run (2/11) | Initial Setup [-1/-1] | Refresh SSH connection
      ansible.builtin.include_role:
        name: _shared/_refresh_connection
  tasks:
    - name: Bootstrap | Run (2/11) | Initial Setup [1/8] | 01 Host Init
      ansible.builtin.include_role:
        name: 01_bootstrap/01_host_init
    - name: Bootstrap | Run (2/11) | Initial Setup [2/8] | 02 Packages
      ansible.builtin.include_role:
        name: 01_bootstrap/02_packages
    - name: Bootstrap | Run (2/11) | Initial Setup [3/8] | 03 sysctl Hardening
      ansible.builtin.include_role:
        name: 01_bootstrap/03_sysctl_hardening
    - name: Bootstrap | Run (2/11) | Initial Setup [4/8] | 04 Core Dumps
      ansible.builtin.include_role:
        name: 01_bootstrap/04_core_dumps
    - name: Bootstrap | Run (2/11) | Initial Setup [5/8] | 05 Shell Security
      ansible.builtin.include_role:
        name: 01_bootstrap/05_shell_security
    - name: Bootstrap | Run (2/11) | Initial Setup [6/8] | 06 Filesystem Hardening
      ansible.builtin.include_role:
        name: 01_bootstrap/06_filesystem_hardening
    - name: Bootstrap | Run (2/11) | Initial Setup [7/8] | 07 AppArmor
      ansible.builtin.include_role:
        name: 01_bootstrap/07_apparmor
    - name: Bootstrap | Run (2/11) | Initial Setup [8/8] | 08 Dist Upgrade
      ansible.builtin.include_role:
        name: 01_bootstrap/08_dist_upgrade
      vars:
        iac__bootstrap__dist_upgrade__enabled: true

- name: Bootstrap | Run (3/11) | User Setup 
  hosts: bootstrap_targets
  become: true
  tags: ['bootstrap', 'run', 'user_setup']
  vars_files:
    - "{{ playbook_dir }}/vars/initial_ssh_connection.yml"
  pre_tasks:
    - name: Bootstrap | Run (3/11) | User Setup [-1/-1] | Refresh SSH connection
      ansible.builtin.include_role:
        name: _shared/_refresh_connection
  tasks:
    - name: Bootstrap | Run (3/11) | User Setup [1/3] | 09 PAM Hardening
      ansible.builtin.include_role:
        name: 01_bootstrap/09_pam_hardening
    - name: Bootstrap | Run (3/11) | User Setup [2/3] | Add New User
      ansible.builtin.include_role:
        name: _shared/_add_new_user
      vars:
        iac__shared__add_new_user__username: "{{ vault__ansible_user__list.get(inventory_hostname) }}"
        iac__shared__add_new_user__password: "{{ vault__ansible_user_password__list.get(inventory_hostname) }}"
        iac__shared__add_new_user__ssh_public_key: "{{ vault__ansible_user_ssh_public_key__list.get(inventory_hostname) }}"
        iac__shared__add_new_user__sudo: true
        iac__shared__add_new_user__sudo_nopasswd: true
    - name: Bootstrap | Run (3/11) | User Setup [3/3] | Update Current User
      ansible.builtin.include_role:
        name: _shared/_update_current_user
      vars:
        iac__shared__update_current_user__password: "{{ vault__initial_ansible_user_password__list.get(inventory_hostname) }}"
        iac__shared__update_current_user__ssh_public_key: "{{ vault__initial_ansible_user_ssh_public_key__list.get(inventory_hostname) }}"

- name: Bootstrap | Run (4/11) | Post User Setup Preflight (Create New SSH Key Files)
  ansible.builtin.import_playbook:  "{{ playbook_dir }}/../_shared/_preflight.yml"
  tags: ['bootstrap', 'run', 'post_user_setup_preflight']
  vars:
    ansible_port: "{{ vault__initial_ansible_port__list.get(inventory_hostname, iac__common__ssh_port) }}"

- name: Bootstrap | Run (5/11) | SSH Setup
  hosts: bootstrap_targets
  become: true
  tags: ['bootstrap', 'run', 'ssh_setup']
  vars_files:
    - "{{ playbook_dir }}/vars/migration_ssh_connection.yml"
  pre_tasks:
    - name: Bootstrap | Run (5/11) | SSH Setup [-1/-1] | Refresh SSH connection
      ansible.builtin.include_role:
        name: _shared/_refresh_connection
  tasks:
    - name: Bootstrap | Run (5/11) | SSH Setup [1/1] | 10 SSH Settings
      ansible.builtin.include_role:
        name: 01_bootstrap/10_ssh_settings

- name: Bootstrap | Run (6/11) | Custom SSH Port Add
  hosts: bootstrap_targets
  become: true
  tags: ['bootstrap', 'run', 'custom_ssh_port_add']
  vars_files:
    - "{{ playbook_dir }}/vars/migration_ssh_connection.yml"
  pre_tasks:
    - name: Bootstrap | Run (6/11) | Custom SSH Port Add [-1/-1] | Refresh SSH connection
      ansible.builtin.include_role:
        name: _shared/_refresh_connection
  tasks:
    - name: Bootstrap | Run (6/11) | Custom SSH Port Add [1/1] | SSH Port Add
      ansible.builtin.include_role:
        name: _shared/_ssh_port_add
      vars:
        iac__shared__ssh_port_add__port: "{{ vault__ansible_port__list.get(inventory_hostname, iac__common__ssh_port) }}"

- name: Bootstrap | Run (7/11) | Post Custom SSH Port Add Preflight (Register new host's SSH ports)
  tags: ['bootstrap', 'run', 'post_custom_ssh_port_add_preflight']
  ansible.builtin.import_playbook: "{{ playbook_dir }}/../_shared/_preflight.yml"

- name: Bootstrap | Run (8/11) | Initial SSH Port Remove
  hosts: bootstrap_targets
  become: true
  tags: ['bootstrap', 'run', 'initial_ssh_port_remove']
  vars_files:
    - "{{ playbook_dir }}/vars/ssh_connection.yml"
  pre_tasks:
    - name: Bootstrap | Run (8/11) | Initial SSH Port Remove [-1/-1] | Refresh SSH connection
      ansible.builtin.include_role:
        name: _shared/_refresh_connection
  tasks:
    - name: Bootstrap | Run (8/11) | Initial SSH Port Remove [1/1] | SSH Port Remove
      ansible.builtin.include_role:
        name: _shared/_ssh_port_remove
      vars:
        iac__shared__ssh_port_remove__port: "{{ vault__initial_ansible_port__list.get(inventory_hostname, iac__common__ssh_port) }}"

- name: Bootstrap | Run (9/11) | Firewall (UFW) Setup
  hosts: bootstrap_targets
  become: true
  tags: ['bootstrap', 'run', 'ufw_setup']
  vars_files:
    - "{{ playbook_dir }}/vars/ssh_connection.yml"
  pre_tasks:
    - name: Bootstrap | Run (9/11) | Firewall (UFW) Setup [-1/-1] | Refresh SSH connection
      ansible.builtin.include_role:
        name: _shared/_refresh_connection
  tasks:
    - name: Bootstrap | Run (9/11) | Firewall (UFW) Setup [1/1] | 11 Firewall (UFW) Setup
      ansible.builtin.include_role:
        name: 01_bootstrap/11_firewall
      vars:
        iac__bootstrap__firewall__ssh_port: "{{ ansible_port }}"

- name: Bootstrap | Run (10/11) | Final Setup
  hosts: bootstrap_targets
  become: true
  tags: ['bootstrap', 'run', 'final_setup']
  vars_files:
    - "{{ playbook_dir }}/vars/ssh_connection.yml"
  pre_tasks:
    - name: Bootstrap | Run (10/11) | Final Setup [-1/-1] | Refresh SSH connection
      ansible.builtin.include_role:
        name: _shared/_refresh_connection
  tasks:
    - name: Bootstrap | Run (10/11) | Final Setup [1/5] | 12 Auditd Setup
      ansible.builtin.include_role:
        name: 01_bootstrap/12_auditd
    - name: Bootstrap | Run (10/11) | Final Setup [2/5] | 13 Fail2Ban Setup
      ansible.builtin.include_role:
        name: 01_bootstrap/13_fail2ban
      vars:
        iac__bootstrap__fail2ban__ssh_port: "{{ ansible_port }}"
    - name: Bootstrap | Run (10/11) | Final Setup [3/5] | 14 Swap Setup
      ansible.builtin.include_role:
        name: 01_bootstrap/14_swap
    - name: Bootstrap | Run (10/11) | Final Setup [4/5] | 15 DNS Setup
      ansible.builtin.include_role:
        name: 01_bootstrap/15_dns
      vars:
        iac__bootstrap__dns__inventory_group: bootstrap_targets
    - name: Bootstrap | Run (10/11) | Final Setup [5/5] | 16 Process Accounting Setup
      ansible.builtin.include_role:
        name: 01_bootstrap/16_process_accounting
      
- name: Bootstrap | Run (11/11) | Verify
  hosts: bootstrap_targets
  become: true
  tags: ['bootstrap', 'run', 'verify']
  vars_files:
    - "{{ playbook_dir }}/vars/ssh_connection.yml"
  pre_tasks:
    - name: Bootstrap | Run (11/11) | Verify [-1/-1] | Refresh SSH connection
      ansible.builtin.include_role:
        name: _shared/_refresh_connection
  tasks:
    - name: Bootstrap | Run (11/11) | Verify [1/1] | 99 Verify
      ansible.builtin.include_role:
        name: 01_bootstrap/99_verify
