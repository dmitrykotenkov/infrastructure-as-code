---
- name: Bootstrap | Preflight
  hosts: bootstrap_targets
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../vars/initial_ssh_auth.yml"

  pre_tasks:
    - name: Set password auth if configured
      ansible.builtin.set_fact:
        ansible_password: "{{ vault__initial_ansible_user_initial_password__list.get(inventory_hostname) }}"
      when: __initial_auth_has_password | bool

    - name: Set SSH key auth if configured
      ansible.builtin.set_fact:
        iac__ansible_ssh_private_key: "{{ vault__initial_ansible_user_initial_ssh_key__list.get(inventory_hostname) }}"
        ansible_ssh_private_key_file: "{{ iac__common__ansible_ssh_private_key_file }}"
      when: __initial_auth_has_ssh_key | bool

    - name: Validate auth method 
      ansible.builtin.include_role:
        name: _shared/_validate_auth_method

    - name: Ensure SSH private key file if needed
      ansible.builtin.include_role:
        name: _shared/_ensure_ssh_key_file
    
    - name: Sync known_hosts for initial ansible port
      ansible.builtin.include_role:
        name: _shared/_sync_known_hosts

    - name: Gather facts
      ansible.builtin.setup:

  tasks:
    - name: Verify SSH connectivity
      ansible.builtin.debug:
        msg: "Connection established to {{ inventory_hostname }} ({{ ansible_host }})"
